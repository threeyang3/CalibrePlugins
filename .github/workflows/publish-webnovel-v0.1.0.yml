name: Publish WebNovel Metadata v0.1.0 (preview)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-webnovel-v0.1.0.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'threeyang3/CalibrePlugins'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install parser test prerequisite
        run: python -m pip install --disable-pip-version-check -r plugins/webnovel-metadata/requirements-dev.txt
      - name: Offline regression tests and reproducible build
        working-directory: plugins/webnovel-metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py'
          python build.py
          python -m zipfile -t dist/WebNovelMetadata.zip
          (cd dist && sha256sum -c WebNovelMetadata.zip.sha256)
          echo '807d2084a1f867853b4d50e25ac071ff8ec079e7de45cdc305f8710a9ba683e2  dist/WebNovelMetadata.zip' | sha256sum -c -
      - name: Create GitHub Release with installable ZIP and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag='webnovel-metadata-v0.1.0'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leave it unchanged."
            exit 0
          fi
          gh release create "$tag" \
            plugins/webnovel-metadata/dist/WebNovelMetadata.zip \
            plugins/webnovel-metadata/dist/WebNovelMetadata.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title 'WebNovel Metadata v0.1.0 (Preview)' \
            --notes-file plugins/webnovel-metadata/docs/RELEASE_0.1.0.md \
            --prerelease
